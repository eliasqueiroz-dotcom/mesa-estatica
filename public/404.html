<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Estática — sinal perdido</title>
    <style>
      :root {
        --void: #0b0d11;
        --concrete-0: #14171d;
        --concrete-2: #262b35;
        --ink: #c6ccd6;
        --ink-dim: #7d8594;
        --rede: #4fc1d4;
        --rede-dim: #2a6d78;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--void);
        color: var(--ink);
        font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        text-align: center;
        max-width: 28rem;
      }
      .codigo {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--ink-dim);
        text-transform: uppercase;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0.6rem 0 0.4rem;
      }
      p {
        color: var(--ink-dim);
        line-height: 1.5;
        margin: 0.4rem 0 1.4rem;
        font-size: 14px;
      }
      a {
        color: var(--rede);
        border: 1px solid var(--rede-dim);
        border-radius: 2px;
        padding: 0.5em 1em;
        text-decoration: none;
        font-size: 13px;
      }
      a:hover {
        background: rgba(79, 193, 212, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="codigo">404 — sinal perdido</div>
      <h1>esse endereço não existe.</h1>
      <p>confira o link que você recebeu — um caractere fora do lugar já derruba a conexão.</p>
      <a href="./">voltar pra mesa</a>
    </main>
  </body>
</html>
